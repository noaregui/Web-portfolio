<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Illustrative mock-up of an AI medical reporting app. Invented UI and fictional
       content (no real product screens, no patient data). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.55" stop-color="#115e59"/>
      <stop offset="1" stop-color="#0b2d3a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#021a1a" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="320" fill="#5eead4" fill-opacity="0.08"/>
  <circle cx="120" cy="920" r="300" fill="#5eead4" fill-opacity="0.06"/>

  <!-- Window -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="1440" height="860" rx="18" fill="#f1f5f9"/>
  </g>
  <path d="M98 70h1404a18 18 0 0 1 18 18v52H80V88a18 18 0 0 1 18-18z" fill="#ffffff"/>
  <rect x="80" y="139" width="1440" height="1" fill="#e2e8f0"/>
  <circle cx="114" cy="105" r="7" fill="#f87171"/>
  <circle cx="138" cy="105" r="7" fill="#fbbf24"/>
  <circle cx="162" cy="105" r="7" fill="#34d399"/>
  <text x="196" y="111" font-size="17" fill="#64748b">Reports</text>
  <text x="268" y="111" font-size="17" fill="#cbd5e1">/</text>
  <text x="286" y="111" font-size="17" font-weight="600" fill="#0f172a">Chest CT — follow-up</text>

  <rect x="1150" y="88" width="170" height="34" rx="17" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="1172" cy="105" r="6" fill="#ef4444"/>
  <text x="1186" y="111" font-size="15" font-weight="600" fill="#b91c1c">Dictating · 02:14</text>
  <rect x="1336" y="88" width="160" height="34" rx="9" fill="#0d9488"/>
  <text x="1416" y="111" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Sign report</text>

  <!-- Left: live transcript -->
  <rect x="100" y="158" width="420" height="752" rx="14" fill="#ffffff" filter="url(#soft)"/>
  <text x="124" y="196" font-size="19" font-weight="700" fill="#0f172a">Live transcript</text>
  <rect x="388" y="180" width="108" height="24" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="442" y="197" font-size="12.5" font-weight="600" fill="#0f766e" text-anchor="middle">2 speakers</text>

  <g font-size="15.5" fill="#334155">
    <text x="124" y="246" font-size="12.5" fill="#94a3b8">00:12 ·<tspan font-weight="700" fill="#0f766e"> Radiologist</tspan></text>
    <text x="124" y="270">Chest CT with contrast, follow-up</text>
    <text x="124" y="292">study.</text>

    <text x="124" y="336" font-size="12.5" fill="#94a3b8">00:31 ·<tspan font-weight="700" fill="#0f766e"> Radiologist</tspan></text>
    <text x="124" y="360">There is a 9 mm nodule in the right</text>
    <text x="124" y="382">upper lobe, stable compared with the</text>
    <text x="124" y="404">prior exam.</text>

    <text x="124" y="448" font-size="12.5" fill="#94a3b8">00:58 ·<tspan font-weight="700" fill="#0369a1"> Resident</tspan></text>
    <text x="124" y="472">No pleural effusion or pneumothorax.</text>

    <rect x="112" y="500" width="396" height="86" rx="10" fill="#f0fdfa"/>
    <text x="124" y="524" font-size="12.5" fill="#94a3b8">01:20 ·<tspan font-weight="700" fill="#0f766e"> Radiologist</tspan></text>
    <text x="124" y="548">Mild degenerative changes in the</text>
    <text x="124" y="570" fill="#64748b">thoracic spine</text>
  </g>
  <rect x="232" y="555" width="2.5" height="20" fill="#0d9488"/>

  <rect x="124" y="760" width="372" height="1" fill="#e2e8f0"/>
  <g stroke="#14b8a6" stroke-linecap="round" stroke-width="5">
    <line x1="210" y1="826" x2="210" y2="842"/>
    <line x1="224" y1="818" x2="224" y2="850"/>
    <line x1="238" y1="808" x2="238" y2="860"/>
    <line x1="252" y1="820" x2="252" y2="848"/>
    <line x1="266" y1="812" x2="266" y2="856"/>
    <line x1="280" y1="824" x2="280" y2="844"/>
    <line x1="294" y1="806" x2="294" y2="862"/>
    <line x1="308" y1="818" x2="308" y2="850"/>
    <line x1="322" y1="828" x2="322" y2="840"/>
    <line x1="336" y1="814" x2="336" y2="854"/>
    <line x1="350" y1="822" x2="350" y2="846"/>
    <line x1="364" y1="826" x2="364" y2="842"/>
    <line x1="378" y1="818" x2="378" y2="850"/>
    <line x1="392" y1="828" x2="392" y2="840"/>
  </g>
  <circle cx="160" cy="834" r="28" fill="#ef4444"/>
  <rect x="153" y="818" width="14" height="22" rx="7" fill="#ffffff"/>
  <path d="M146 832a14 14 0 0 0 28 0M160 846v6" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <text x="430" y="840" font-size="13" fill="#94a3b8">ES · EN</text>

  <!-- Center: generated report -->
  <rect x="540" y="158" width="600" height="752" rx="14" fill="#ffffff" filter="url(#soft)"/>
  <text x="568" y="198" font-size="22" font-weight="700" fill="#0f172a">Chest CT · Follow-up</text>
  <rect x="1028" y="180" width="88" height="26" rx="13" fill="#ccfbf1"/>
  <text x="1072" y="198" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">AI draft</text>
  <rect x="568" y="220" width="544" height="1" fill="#e2e8f0"/>

  <g font-size="16" fill="#1e293b">
    <text x="568" y="258" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#0f766e">INDICATION</text>
    <text x="568" y="284">Follow-up of a known pulmonary nodule.</text>

    <text x="568" y="330" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#0f766e">TECHNIQUE</text>
    <text x="568" y="356">Contrast-enhanced CT of the chest.</text>

    <text x="568" y="402" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#0f766e">FINDINGS</text>
    <text x="568" y="428">9 mm nodule in the right upper lobe, unchanged since</text>
    <text x="568" y="452">the prior study <tspan font-weight="700" fill="#0369a1">[1]</tspan>. No pleural effusion or pneumothorax.</text>
    <text x="568" y="476">Mild degenerative changes of the thoracic spine.</text>

    <text x="568" y="522" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#0f766e">IMPRESSION</text>
    <rect x="558" y="534" width="564" height="62" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="568" y="558">1. Stable 9 mm right upper lobe nodule. Follow-up CT</text>
    <text x="568" y="582">    in 12 months, as per guidelines <tspan font-weight="700" fill="#0369a1">[2]</tspan>.</text>
  </g>
  <path d="M574 614l3.5 7.5 7.5 3.5-7.5 3.5-3.5 7.5-3.5-7.5-7.5-3.5 7.5-3.5z" fill="#f59e0b"/>
  <text x="590" y="630" font-size="13" fill="#15803d">Edited by the assistant · 01:42</text>

  <rect x="568" y="680" width="544" height="1" fill="#e2e8f0"/>
  <text x="568" y="716" font-size="13" font-weight="700" fill="#64748b">Quality checks</text>
  <g font-size="14" fill="#166534">
    <rect x="568" y="734" width="176" height="34" rx="17" fill="#f0fdf4" stroke="#bbf7d0"/>
    <path d="M584 751l5 5 9-10" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="606" y="756">Required sections</text>
    <rect x="756" y="734" width="166" height="34" rx="17" fill="#f0fdf4" stroke="#bbf7d0"/>
    <path d="M772 751l5 5 9-10" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="794" y="756">Citations verified</text>
    <rect x="568" y="780" width="200" height="34" rx="17" fill="#f0fdf4" stroke="#bbf7d0"/>
    <path d="M584 797l5 5 9-10" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="606" y="802">Patient data removed</text>
  </g>
  <rect x="568" y="852" width="132" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="634" y="876" font-size="14.5" font-weight="600" fill="#334155" text-anchor="middle">Regenerate</text>
  <rect x="712" y="852" width="96" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="760" y="876" font-size="14.5" font-weight="600" fill="#334155" text-anchor="middle">Copy</text>
  <text x="1112" y="876" font-size="13" fill="#94a3b8" text-anchor="end">142 words</text>

  <!-- Right: assistant -->
  <rect x="1160" y="158" width="340" height="752" rx="14" fill="#ffffff" filter="url(#soft)"/>
  <path d="M1192 182l4.5 9.5 9.5 4.5-9.5 4.5-4.5 9.5-4.5-9.5-9.5-4.5 9.5-4.5z" fill="#f59e0b"/>
  <text x="1214" y="203" font-size="19" font-weight="700" fill="#0f172a">Assistant</text>

  <rect x="1236" y="232" width="244" height="62" rx="14" fill="#0d9488"/>
  <text x="1254" y="258" font-size="15" fill="#ffffff">Make the impression</text>
  <text x="1254" y="280" font-size="15" fill="#ffffff">more concise.</text>

  <rect x="1180" y="310" width="270" height="86" rx="14" fill="#f1f5f9"/>
  <text x="1198" y="336" font-size="15" fill="#1e293b">Done. I shortened the</text>
  <text x="1198" y="358" font-size="15" fill="#1e293b">impression and kept both</text>
  <text x="1198" y="380" font-size="15" fill="#1e293b">references.</text>

  <text x="1180" y="440" font-size="13" font-weight="700" fill="#64748b">Sources</text>
  <rect x="1180" y="456" width="300" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1196" y="484" font-size="14.5" font-weight="700" fill="#0369a1">[1]<tspan fill="#0f172a" font-weight="600"> Prior chest CT</tspan></text>
  <text x="1196" y="508" font-size="13" fill="#64748b">Patient history · 12 Mar 2025</text>
  <rect x="1180" y="538" width="300" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1196" y="566" font-size="14.5" font-weight="700" fill="#0369a1">[2]<tspan fill="#0f172a" font-weight="600"> Pulmonary nodule</tspan></text>
  <text x="1196" y="590" font-size="13" fill="#64748b">Clinical guideline · 2017</text>

  <rect x="1180" y="852" width="300" height="40" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1200" y="877" font-size="14.5" fill="#94a3b8">Ask about this report…</text>
  <circle cx="1460" cy="872" r="15" fill="#0d9488"/>
  <path d="M1453 872h13m-5-5 5 5-5 5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
